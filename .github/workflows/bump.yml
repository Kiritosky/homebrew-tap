# Points the cask at the latest Brainmatter release. Commits only when there
# is a newer one.
name: Bump

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bump

jobs:
  bump:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CASK: Casks/brainmatter.rb
      REPO: Kiritosky/brainmatter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the cask
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$CASK")"
          release="$(gh api "repos/$REPO/releases/latest")"
          tag="$(jq -r .tag_name <<<"$release")"
          if ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected release tag $tag"
            exit 1
          fi
          latest="${tag#v}"
          if [ "$latest" = "$current" ]; then
            echo "The cask is at $current already."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" != "$latest" ]; then
            echo "The latest release $latest is older than the cask's $current."
            exit 0
          fi

          name="Brainmatter_${latest}_aarch64.dmg"
          dmg="$RUNNER_TEMP/$name"
          if ! curl -fsSL --retry 3 -o "$dmg" "https://github.com/$REPO/releases/download/v$latest/$name"; then
            echo "::error::Release $tag has no $name"
            exit 1
          fi
          sha256="$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)"
          digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")"
          if [ -n "$digest" ] && [ "$digest" != "sha256:$sha256" ]; then
            echo "::error::$name does not match the digest GitHub reports ($digest)"
            exit 1
          fi

          VERSION="$latest" SHA256="$sha256" perl -pi -e '
            s/^  version "[^"]+"$/  version "$ENV{VERSION}"/;
            s/^  sha256 "[0-9a-f]{64}"$/  sha256 "$ENV{SHA256}"/;
          ' "$CASK"
          grep -qx "  version \"$latest\"" "$CASK"
          grep -qx "  sha256 \"$sha256\"" "$CASK"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Cask moves from $current to $latest."

      - name: Check style
        if: steps.bump.outputs.version
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew style "$CASK"

      - name: Commit
        if: steps.bump.outputs.version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: brainmatter $VERSION"
          git push
